[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluke8840a-dmm-gui"
version = "1.0.0-dev"
description = "Python FLUKE 8840A DMM GUI"
authors = [{ name = "Lorenzo Mariani", email = "newmarioman@hotmail.it" }]
license = {text = "MIT"}
readme = "Readme.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["fluke8840a*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["F"]